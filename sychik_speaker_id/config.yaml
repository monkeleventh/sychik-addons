name: "SychiK Speaker ID"
version: "1.1.0"
slug: "sychik_speaker_id"
description: "Speaker identification via resemblyzer (256-dim LDE embedding + cosine similarity)"
url: "https://github.com/monkeleventh/sychik-addons"
image: "ghcr.io/monkeleventh/sychik_speaker_id"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: false
auth_api: false
host_network: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Speaker ID REST API (FastAPI)"
map:
  - share/sychik_speaker_id:rw
environment:
  DATA_DIR: "/data"
  SIM_THRESHOLD: "0.75"
  LOG_LEVEL: "INFO"
options:
  threshold: 0.75
  log_level: "INFO"
schema:
  threshold: "float(0.0,1.0)"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)?"
watchdog: "http://[HOST]:[PORT:8000]/health"
